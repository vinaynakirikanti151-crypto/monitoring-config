apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: node-monitoring-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: node-alerts
      rules:
        - alert: NodeDown
          expr: up{job="node-exporter"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node is down"
            description: "Node {{ $labels.instance }} has been down for more than 5 minutes."
